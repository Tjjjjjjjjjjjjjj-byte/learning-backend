<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="#282828" />
  
  <!-- Left Circle: Vibrant Spotify Green (Base Layer) -->
  <circle cx="42" cy="54" r="17" fill="#52B669" />
  
  <!-- Right Circle: Mint Green with Alpha Opacity -->
  <!-- Layering this translucent light color natively builds the third bright color shape in the center -->
  <circle cx="56" cy="44" r="17" fill="#A8EBB5" fill-opacity="0.75" />
</svg>
